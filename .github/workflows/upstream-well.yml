name: upstream-well

# Every new commit on Well's main (leen-saz/well-ads) becomes a pull request here (scripts/upstream-sync.sh).
# Started hourly by the production Worker's Cron Trigger (src/lib/cron.ts) and by hand; the schedule is a fallback.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-well
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Open a PR with Well's new commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream-sync.sh
